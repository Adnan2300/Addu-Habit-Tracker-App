<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <h1>Habits</h1>
        <div class="header-actions">
          <button id="calendar-btn" class="icon-btn" aria-label="Open Calendar">📅</button>
          <button id="theme-btn" class="icon-btn" aria-label="Toggle Theme">🌙</button>
        </div>
      </div>
      <p id="current-date">Today</p>
    </header>

    <div class="analytics-card">
      <div class="stat">
        <span id="stat-total">0</span>
        <label>Habits</label>
      </div>
      <div class="stat">
        <span id="stat-completed">0</span>
        <label>Completed</label>
      </div>
      <div class="stat">
        <span id="stat-streak">0</span>
        <label>Best Streak</label>
      </div>
    </div>

    <form id="add-habit-form">
      <input type="text" id="habit-input" placeholder="New habit name..." required>
      <div class="form-row">
        <!-- Category input with pre-filled suggestions -->
        <input type="text" id="habit-category" list="category-options" placeholder="Category (or select below)">
        <datalist id="category-options">
          <option value="Health">
          <option value="Fitness">
          <option value="Productivity">
          <option value="Mindfulness">
          <option value="Finance">
        </datalist>

        <!-- Frequency options with custom choice -->
        <select id="habit-frequency">
          <option value="Daily">Daily</option>
          <option value="Weekly">Weekly</option>
          <option value="Monthly">Monthly</option>
          <option value="Custom">Custom...</option>
        </select>

        <button type="submit" class="add-btn">+</button>
      </div>

      <!-- Custom Frequency Field (revealed when Custom is chosen) -->
      <input type="text" id="custom-frequency-input" class="hidden-field" placeholder="Enter custom schedule (e.g. 3x a week, Every Mon/Thu)">
    </form>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="All">All</button>
    </div>

    <div id="habit-list"></div>
  </div>

  <!-- Streak Calendar Modal -->
  <div id="calendar-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="calendar-month-title">Streak Calendar</h2>
        <button id="close-modal-btn" class="close-btn">✕</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
      <div class="cal-details-card">
        <h4 id="selected-date-text">Select a day</h4>
        <p id="selected-stats-text">Tap any date to inspect completion performance.</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
