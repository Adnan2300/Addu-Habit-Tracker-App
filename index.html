<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Habit & Activity Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Habit Tracker</h1>
            <div class="date-badge" id="dateDisplay">Loading date...</div>
        </div>
        <div class="header-right">
            <div class="clock-badge" id="clock">00:00:00.000</div>
            <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
        </div>
    </header>

    <!-- Top Summary Overview -->
    <div class="fitness-grid">
        <div class="fitness-card">
            <div class="metric-val" id="totalCompletions">0</div>
            <div class="metric-lbl">Total Completions</div>
        </div>
        <div class="fitness-card">
            <div class="metric-val" id="activeHabitsCount">0</div>
            <div class="metric-lbl">Active Tracks</div>
        </div>
    </div>

    <!-- Discrete Controls & Action Row -->
    <div class="toolbar">
        <div class="search-filter-wrapper">
            <input type="text" id="searchFilter" placeholder="🔍 Search..." oninput="renderHabits()">
            <select id="categoryFilter" onchange="renderHabits()">
                <option value="All">All Categories</option>
            </select>
        </div>
        <button class="secondary-btn" onclick="openAnalyticsModal()">📊 Analytics</button>
    </div>

    <!-- Habits List -->
    <div id="habitsList"></div>
</div>

<!-- Floating Action Button (+ New Habit) -->
<button class="fab" onclick="openAddModal()" title="Add New Habit">+</button>

<!-- Add Habit Modal Popup -->
<div class="modal-overlay" id="addModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>New Activity Track</h3>
            <button class="close-btn" onclick="closeAddModal()">&times;</button>
        </div>
        <div class="modal-body">
            <label class="input-label">Habit Name</label>
            <input type="text" id="newHabitName" placeholder="e.g., Morning Workout, Read 20 pages...">
            
            <label class="input-label">Category Tag</label>
            <input type="text" id="newCategoryInput" list="categoryOptions" placeholder="Select or type a category...">
            <datalist id="categoryOptions"></datalist>

            <label class="input-label">Track Accent Color</label>
            <input type="color" id="habitColor" value="#8b5cf6" class="color-picker">
        </div>
        <div class="modal-footer">
            <button class="secondary-btn" onclick="closeAddModal()">Cancel</button>
            <button class="primary-btn" onclick="addHabit()">Create Track</button>
        </div>
    </div>
</div>

<!-- Edit Habit Modal Popup -->
<div class="modal-overlay" id="editModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Edit Activity Track</h3>
            <button class="close-btn" onclick="closeEditModal()">&times;</button>
        </div>
        <div class="modal-body">
            <label class="input-label">Habit Name</label>
            <input type="text" id="editHabitName" placeholder="Update habit name...">
            
            <label class="input-label">Category Tag</label>
            <input type="text" id="editCategoryInput" list="editCategoryOptions" placeholder="Select or type a category...">
            <datalist id="editCategoryOptions"></datalist>

            <label class="input-label">Track Accent Color</label>
            <input type="color" id="editHabitColor" class="color-picker">
        </div>
        <div class="modal-footer">
            <button class="secondary-btn" onclick="closeEditModal()">Cancel</button>
            <button class="primary-btn" onclick="saveEditHabit()">Save Changes</button>
        </div>
    </div>
</div>

<!-- Detailed Visual Analytics Modal -->
<div class="modal-overlay" id="analyticsModal">
    <div class="modal-card modal-large">
        <div class="modal-header">
            <h3>Visual Analytics Dashboard</h3>
            <button class="close-btn" onclick="closeAnalyticsModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="analytics-section-title">Completions by Tag / Category</div>
            <div class="category-chart-wrapper">
                <canvas id="categoryPieChart"></canvas>
            </div>

            <div class="analytics-section-title">Individual Activity Breakdowns (Monthly Totals)</div>
            <div class="individual-charts-grid" id="individualHabitAnalytics"></div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
