<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <div>
          <h1>Habits 🎉</h1>
          <p id="current-date"></p>
        </div>
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme">🌙</button>
      </div>

      <!-- Analytics Banner -->
      <div class="analytics-card">
        <div class="stat">
          <span id="stat-total">0</span>
          <label>Total Habits</label>
        </div>
        <div class="stat">
          <span id="stat-rate">0%</span>
          <label>Today's Rate</label>
        </div>
        <div class="stat">
          <span id="stat-best">0</span>
          <label>Best Streak</label>
        </div>
      </div>
    </header>

    <!-- Habit Creation Form with Custom Tag Support -->
    <form id="add-habit-form">
      <input type="text" id="habit-input" placeholder="New habit name..." required>
      <div class="form-row">
        <!-- Custom or Select Category -->
        <input type="text" id="habit-category" list="category-options" placeholder="Category (or type custom)" required>
        <datalist id="category-options">
          <option value="Fitness"></option>
          <option value="Study"></option>
          <option value="Mindfulness"></option>
          <option value="Work"></option>
          <option value="General"></option>
        </datalist>

        <!-- Custom or Select Duration/Frequency -->
        <input type="text" id="habit-frequency" list="frequency-options" placeholder="Frequency" required>
        <datalist id="frequency-options">
          <option value="Daily"></option>
          <option value="3x/week"></option>
          <option value="Weekdays"></option>
          <option value="Weekends"></option>
        </datalist>

        <button type="submit" class="add-btn">+</button>
      </div>
    </form>

    <!-- Dynamic Category Filter Bar -->
    <div id="filter-bar" class="filter-bar">
      <button class="filter-btn active" data-category="All">All</button>
    </div>

    <!-- Habit Cards List -->
    <main id="habit-list" class="habit-list"></main>

    <!-- Backup / Restore Controls -->
    <footer class="data-management">
      <button id="export-btn" class="secondary-btn">📦 Export Data</button>
      <label for="import-file" class="secondary-btn">📥 Restore Data</label>
      <input type="file" id="import-file" accept=".json" style="display: none;">
    </footer>
  </div>

  <div id="confetti-container"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('SW Registration Failed:', err));
    }
  </script>
</body>
</html>
