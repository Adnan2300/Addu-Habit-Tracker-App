<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-top">
        <div>
          <h1>Habits</h1>
          <p id="current-date"></p>
        </div>
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme">🌙</button>
      </div>

      <!-- Analytics Banner -->
      <div class="analytics-card">
        <div class="stat">
          <span id="stat-total">0</span>
          <label>Total Habits</label>
        </div>
        <div class="stat">
          <span id="stat-rate">0%</span>
          <label>Today's Rate</label>
        </div>
        <div class="stat">
          <span id="stat-best">0</span>
          <label>Best Streak</label>
        </div>
      </div>
    </header>

    <!-- Habit Creation Form -->
    <form id="add-habit-form">
      <input type="text" id="habit-input" placeholder="New habit name..." required>
      <div class="form-row">
        <select id="habit-category">
          <option value="Fitness"> Fitness</option>
          <option value="Study"> Study</option>
          <option value="Mindfulness"> Mindfulness</option>
          <option value="Work"> Work</option>
          <option value="General"> General</option>
        </select>
        <select id="habit-frequency">
          <option value="Daily">Daily</option>
          <option value="3x/week">3x / week</option>
          <option value="Weekdays">Weekdays</option>
        </select>
        <button type="submit" class="add-btn">+</button>
      </div>
    </form>

    <!-- Category Filter Bar -->
    <div id="filter-bar" class="filter-bar">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Fitness">Fitness</button>
      <button class="filter-btn" data-category="Study">Study</button>
      <button class="filter-btn" data-category="Mindfulness">Mindfulness</button>
      <button class="filter-btn" data-category="Work">Work</button>
    </div>

    <!-- Habit Cards List -->
    <main id="habit-list" class="habit-list"></main>

    <!-- Backup / Restore Controls -->
    <footer class="data-management">
      <button id="export-btn" class="secondary-btn"> Export Data</button>
      <label for="import-file" class="secondary-btn"> Restore Data</label>
      <input type="file" id="import-file" accept=".json" style="display: none;">
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('SW Registration Failed:', err));
    }
  </script>
</body>
</html>
